<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional CGPA Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:90%;
    max-width:420px;
    background:#111827;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(0,255,255,0.2);
    text-align:center;
}

h1{
    color:#38bdf8;
    margin-bottom:20px;
}

p{
    color:#cbd5e1;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
    font-size:16px;
}

input:focus{
    outline:2px solid #38bdf8;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:#000;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
}

.result{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#1f2937;
    font-size:20px;
    font-weight:bold;
    color:#22c55e;
}
</style>
</head>

<body>

<div class="container">
    <h1>🎓 CGPA Calculator</h1>
    <p>Enter your GPA and Total Credits</p>

    <input type="number" id="gpa" placeholder="Enter GPA (0 - 10)" step="0.01">

    <input type="number" id="credits" placeholder="Enter Total Credits">

    <button onclick="calculateCGPA()">Calculate CGPA</button>

    <div class="result" id="result">
        Your CGPA will appear here
    </div>
</div>

<script>
function calculateCGPA(){

    let gpa = parseFloat(document.getElementById("gpa").value);
    let credits = parseFloat(document.getElementById("credits").value);

    if(isNaN(gpa) || isNaN(credits)){
        document.getElementById("result").innerHTML =
        "⚠ Please enter valid values";
        return;
    }

    let cgpa = (gpa * credits) / credits;

    document.getElementById("result").innerHTML =
    "✅ CGPA: " + cgpa.toFixed(2);
}
</script>

</body>
</html>
