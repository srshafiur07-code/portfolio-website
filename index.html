  <style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e3a8a);
padding:20px;
}

.container{
width:100%;
max-width:500px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(0,255,255,.3);
}

h1{
text-align:center;
color:#38bdf8;
margin-bottom:10px;
}

p{
text-align:center;
color:#cbd5e1;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
background:#38bdf8;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

.result{
margin-top:20px;
padding:15px;
background:#0f172a;
border-radius:10px;
text-align:center;
font-size:22px;
color:#22c55e;
font-weight:bold;
}

.grade{
margin-top:10px;
text-align:center;
font-size:18px;
color:#facc15;
}

.footer{
margin-top:20px;
text-align:center;
color:#94a3b8;
font-size:14px;
}
</style></head><body><div class="container"><h1>🎓 College CGPA Calculator</h1>
<p>Professional Student Project</p><input type="number" id="gpa" placeholder="Enter GPA (0 - 10)">
<input type="number" id="credits" placeholder="Enter Total Credits"><button onclick="calculateCGPA()">Calculate CGPA</button>

<div class="result" id="result">
Your CGPA will appear here
</div><div class="grade" id="grade"></div><div class="footer">
Created by Shafiur Rahman
</div></div><script>
function calculateCGPA(){

let gpa=parseFloat(document.getElementById("gpa").value);
let credits=parseFloat(document.getElementById("credits").value);

if(isNaN(gpa)||isNaN(credits)){
document.getElementById("result").innerHTML="Enter valid values";
document.getElementById("grade").innerHTML="";
return;
}

let cgpa=gpa.toFixed(2);

let grade="";

if(cgpa>=9)
grade="Grade : O (Outstanding)";
else if(cgpa>=8)
grade="Grade : A+";
else if(cgpa>=7)
grade="Grade : A";
else if(cgpa>=6)
grade="Grade : B";
else
grade="Grade : C";

document.getElementById("result").innerHTML="CGPA : "+cgpa;
document.getElementById("grade").innerHTML=grade;
}
</script></body>
